dialog.certificate.show=<html>Ito ang sertipiko at pribadong susi na sinusubukan mong idagdag sa TrustStore. <br><br> Pagkatapos idagdag ang sertipikong ito, makakapagtatag ang Spark ng mga ligtas na komunikasyon na <br> sa mga server na kinikilala ng sertipikong ito. <br><br> Kung sigurado kang gusto mong idagdag ang sertipikong ito, i-click ang buton na OK.</html>
