dialog.certificate.is.distrusted=Το πιστοποιητικό δεν είναι έγκυρο, επομένως δεν πρέπει να είναι αξιόπιστο, καθώς είναι επικίνδυνο. \n Εάν εξακολουθείτε να το εμπιστεύεστε, κάντε κλικ στο κουμπί επιλογής "Εμπιστοσύνη" ή προσθέστε το σε μια λίστα εξαιρέσεων.
dialog.certificate.sure.to.delete=Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτό το πιστοποιητικό; \nΕάν το κάνετε, δεν θα μπορείτε να δημιουργήσετε μια ασφαλή σύνδεση \nμε διακομιστές που προσδιορίζονται από αυτό το πιστοποιητικό.
