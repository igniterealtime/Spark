dialog.certificate.show=<html>Αυτό είναι το πιστοποιητικό και το ιδιωτικό κλειδί που προσπαθείτε να προσθέσετε στο TrustStore. <br><br> Μετά την προσθήκη αυτού του πιστοποιητικού, το Spark θα μπορεί να δημιουργήσει ασφαλείς <br> επικοινωνίες με διακομιστές που προσδιορίζονται από αυτό το πιστοποιητικό. <br><br> Εάν είστε βέβαιοι ότι θέλετε να προσθέσετε αυτό το πιστοποιητικό, κάντε κλικ στο κουμπί OK.</html>
dialog.id.certificate.show=<html>Αυτό είναι το πιστοποιητικό που προσπαθείτε να προσθέσετε στο IdentityStore <br><br> Μετά την προσθήκη αυτού του πιστοποιητικού, το Spark θα μπορεί να παρουσιάσει αυτό το πιστοποιητικό σε έναν απομακρυσμένο διακομιστή κατά τη δημιουργία της σύνδεσης, προκειμένου να ελεγχθεί και να κρυπτογραφήσει τη σύνδεση. <br><br> Εάν είστε βέβαιοι ότι θέλετε να προσθέσετε αυτό το πιστοποιητικό, κάντε κλικ στο κουμπί OK.</html>
dialog.certificate.add.from.connection=<html>Αυτό είναι το πιστοποιητικό που παρέχεται από τον διακομιστή στον οποίο προσπαθείτε να συνδεθείτε. <br> Αυτό το πιστοποιητικό δεν βρίσκεται στο TrustStore σας, που σημαίνει ότι δεν είναι αξιόπιστο<br> και δεν μπορείτε να συνδεθείτε σε αυτόν τον διακομιστή. <br><br> Θέλετε να το εμπιστευτείτε και να προσθέσετε αυτό το πιστοποιητικό στο TrustStore;</html>
dialog.certificate.unrecognized.server.certificate=<html>Ο διακομιστής στον οποίο συνδέεστε ταυτοποιείται με ένα πιστοποιητικό που <br>δεν αναγνωρίζεται από το Spark. Διαβάστε τις παρακάτω λεπτομέρειες.</html>
dialog.certificate.ask.allow.self-signed=<html>Ο διακομιστής στον οποίο συνδέεστε ταυτίζεται με ένα πιστοποιητικό που είναι αυτο-υπογεγραμμένο. <br>Η τρέχουσα διαμόρφωση του Spark δεν επιτρέπει τη χρήση αυτο-υπογεγραμμένων πιστοποιητικών.<br>Θέλετε να αλλάξετε αυτήν τη διαμόρφωση και να προσπαθήσετε ξανά;</html>
dialog.certificate.subject.label=Θέμα:

dialog.certificate.add.unrecognized.server.certificate=<html>Θέλετε να προσθέσετε αυτό το πιστοποιητικό στο σύνολο πιστοποιητικών που είναι αξιόπιστα από το Spark;</html>
dialog.certificate.chain.add.from.connection=<html>Αυτή είναι η αλυσίδα πιστοποιητικών που παρέχεται από τον διακομιστή στον οποίο συνδέεστε. <br> Δεν βρίσκεται στη λίστα αξιόπιστων στοιχείων σας, επομένως δεν μπορείτε να συνδεθείτε. <br><br> Θέλετε να προσθέσετε αυτά τα πιστοποιητικά στη λίστα αξιόπιστων;</html>
dialog.certificate.cannot.have.copy=Αυτό το πιστοποιητικό είναι ήδη αποθηκευμένο στο TrustStore.
dialog.certificate.has.been.added=Το πιστοποιητικό προστέθηκε στο TrustStore.
