dialog.certificate.show=<html>এই হলো সেই সার্টিফিকেট এবং প্রাইভেট কী যা আপনি ট্রাস্টস্টোরে যোগ করতে চাইছেন।<br><br>এই সার্টিফিকেটটি যোগ করার পর, স্পার্ক এই সার্টিফিকেট দ্বারা চিহ্নিত সার্ভারগুলোর সাথে সুরক্ষিত যোগাযোগ স্থাপন করতে সক্ষম হবে।<br><br>আপনি যদি এই সার্টিফিকেটটি যোগ করার ব্যাপারে নিশ্চিত হন, তাহলে ওকে (OK) বোতামে ক্লিক করুন।</html>
dialog.id.certificate.show=<html>এই সেই সার্টিফিকেট যা আপনি আইডেন্টিটিস্টোরে (IdentityStore) যোগ করতে চাইছেন।<br><br>এই সার্টিফিকেটটি যোগ করার পর, স্পার্ক (Spark) সংযোগ স্থাপনের সময় নিজেকে প্রমাণীকৃত করতে এবং সেই সংযোগটি এনক্রিপ্ট করার জন্য দূরবর্তী সার্ভারের কাছে এটি উপস্থাপন করতে পারবে।<br><br>আপনি যদি এই সার্টিফিকেটটি যোগ করার ব্যাপারে নিশ্চিত হন, তাহলে ওকে (OK) বোতামে ক্লিক করুন।</html>
dialog.certificate.add.from.connection=<html>আপনি যে সার্ভারে সংযোগ করার চেষ্টা করছেন, এটি সেই সার্ভারের দেওয়া সার্টিফিকেট।<br> এই সার্টিফিকেটটি আপনার ট্রাস্টস্টোরে নেই, যার মানে এটি বিশ্বস্ত নয়<br> এবং আপনি এই সার্ভারে সংযোগ করতে পারবেন না।<br><br> আপনি কি এটিকে বিশ্বাস করে আপনার ট্রাস্টস্টোরে যোগ করতে চান?</html>
dialog.certificate.unrecognized.server.certificate=<html>আপনি যে সার্ভারে সংযোগ করার চেষ্টা করছেন, সেটি এমন একটি সার্টিফিকেট দিয়ে নিজেকে শনাক্ত করে যা Spark দ্বারা স্বীকৃত নয়। অনুগ্রহ করে নিচের বিবরণ পর্যালোচনা করুন।</html>
dialog.certificate.ask.allow.self-signed=<html>আপনি যে সার্ভারে সংযোগ করছেন সেটি একটি সেলফ-সাইন্ড সার্টিফিকেটের মাধ্যমে নিজেকে শনাক্ত করে।<br>স্পার্ক-এর বর্তমান কনফিগারেশন সেলফ-সাইন্ড সার্টিফিকেট ব্যবহারের অনুমতি দেয় না।<br>আপনি কি এই কনফিগারেশনটি পরিবর্তন করে আবার চেষ্টা করতে চান?</html>
