dialog.id.certificate.show=<html>Ово је сертификат који покушавате да додате у IdentityStore <br><br> Након додавања овог сертификата, Spark ће моћи да га представи удаљеном серверу током успостављања везе како би се аутентификовао и шифровао ту везу. <br><br> Ако сте сигурни да желите да додате овај сертификат, кликните на дугме У реду.</html>
dialog.certificate.add.from.connection=<html>Ово је сертификат који је обезбедио сервер са којим покушавате да се повежете. <br> Овај сертификат није у вашем продавници поверења, што значи да није поуздан<br> и не можете да се повежете са овим сервером. <br><br> Да ли желите да му верујете и додате овај сертификат у своју продавницу поверења?</html>
dialog.certificate.unrecognized.server.certificate=<html>Сервер са којим се повезујете идентификује се сертификатом који <br>Spark не препознаје. Молимо вас да прегледате детаље испод.</html>
dialog.certificate.ask.allow.self-signed=<html>Сервер са којим се повезујете идентификује се сертификатом који је самопотписан. <br>Тренутна конфигурација Spark-а не дозвољава употребу самопотписаних сертификата.<br>Да ли желите да промените ову конфигурацију и покушате поново?</html>
dialog.certificate.subject.label=Предмет:

dialog.certificate.add.unrecognized.server.certificate=<html>Да ли желите да додате овај сертификат у скуп сертификата којима Spark верује?</html>
dialog.certificate.chain.add.from.connection=<html>Ово је ланац сертификата који пружа сервер са којим се повезујете. <br> Није на вашој листи поузданих сертификата, тако да не можете да се повежете. <br><br> Да ли желите да додате ове сертификате на листу поузданих сертификата?</html>
