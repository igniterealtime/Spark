dialog.certificate.chain.add.from.connection=<html>นี่คือชุดใบรับรองที่เซิร์ฟเวอร์ที่คุณกำลังเชื่อมต่อให้มา<br> ใบรับรองเหล่านี้ไม่ได้อยู่ในรายการที่เชื่อถือได้ของคุณ ดังนั้นคุณจึงไม่สามารถเชื่อมต่อได้<br><br> คุณต้องการเพิ่มใบรับรองเหล่านี้ลงในรายการที่เชื่อถือได้ของคุณหรือไม่</html>
