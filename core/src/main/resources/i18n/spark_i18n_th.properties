dialog.certificate.add.from.connection=<html>นี่คือใบรับรองที่ได้รับจากเซิร์ฟเวอร์ที่คุณกำลังพยายามเชื่อมต่อ<br> ใบรับรองนี้ไม่ได้อยู่ใน TrustStore ของคุณ ซึ่งหมายความว่าใบรับรองนี้ไม่น่าเชื่อถือ<br> และคุณไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์นี้ได้<br><br> คุณต้องการยอมรับและเพิ่มใบรับรองนี้ลงใน TrustStore ของคุณหรือไม่</html>
dialog.certificate.unrecognized.server.certificate=<html>เซิร์ฟเวอร์ที่คุณกำลังเชื่อมต่อระบุตัวตนด้วยใบรับรองที่ <br>ไม่ได้รับการยอมรับจาก Spark โปรดตรวจสอบรายละเอียดด้านล่าง</html>
dialog.certificate.ask.allow.self-signed=<html>เซิร์ฟเวอร์ที่คุณกำลังเชื่อมต่อใช้ใบรับรองที่ลงนามด้วยตนเองในการระบุตัวตน<br>การตั้งค่าปัจจุบันของ Spark ไม่อนุญาตให้ใช้ใบรับรองที่ลงนามด้วยตนเอง<br>คุณต้องการเปลี่ยนการตั้งค่านี้แล้วลองใหม่อีกครั้งหรือไม่</html>
