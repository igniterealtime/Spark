dialog.certificate.show=<html>Това е сертификатът и частният ключ, които се опитвате да добавите към TrustStore. <br><br> След добавяне на този сертификат, Spark ще може да установи защитена <br> комуникация със сървъри, които са идентифицирани от този сертификат. <br><br> Ако сте сигурни, че искате да добавите този сертификат, щракнете върху бутона OK.</html>
dialog.id.certificate.show=<html>Това е сертификатът, който се опитвате да добавите към IdentityStore. <br><br> След добавяне на този сертификат, Spark ще може да го представи на отдалечен сървър по време на установяване на връзка, за да се удостовери и криптира връзката. <br><br> Ако сте сигурни, че искате да добавите този сертификат, щракнете върху бутона OK.</html>
dialog.certificate.add.from.connection=<html>Това е сертификатът, предоставен от сървъра, към който се опитвате да се свържете. <br> Този сертификат не е във вашето хранилище за доверие, което означава, че не е надежден<br> и не можете да се свържете с този сървър. <br><br> Искате ли да му се доверите и да добавите този сертификат към вашето хранилище за доверие?</html>
dialog.certificate.unrecognized.server.certificate=<html>Сървърът, към който се свързвате, се идентифицира със сертификат, който <br>не се разпознава от Spark. Моля, прегледайте подробностите по-долу.</html>
dialog.certificate.ask.allow.self-signed=<html>Сървърът, към който се свързвате, се идентифицира със самоподписан сертификат. <br>Текущата конфигурация на Spark не позволява използването на самоподписани сертификати.<br>Искате ли да промените тази конфигурация и да опитате отново?</html>
dialog.certificate.subject.label=Тема:

