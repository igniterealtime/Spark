dialog.certificate.show=<html>هذه هي الشهادة والمفتاح الخاص اللذان تحاول إضافتهما إلى مخزن الشهادات الموثوقة.<br><br>بعد إضافة هذه الشهادة، سيتمكن Spark من إنشاء اتصالات آمنة<br> مع الخوادم التي تُعرّفها هذه الشهادة.<br><br>إذا كنت متأكدًا من رغبتك في إضافة هذه الشهادة، فانقر على زر "موافق".</html>
dialog.id.certificate.show=<html>هذه هي الشهادة التي تحاول إضافتها إلى مخزن الهوية.<br><br>بعد إضافة هذه الشهادة، سيتمكن Spark من تقديمها إلى خادم بعيد أثناء إنشاء الاتصال للتحقق من هويته وتشفير هذا الاتصال.<br><br>إذا كنت متأكدًا من رغبتك في إضافة هذه الشهادة، فانقر على زر "موافق".</html>
dialog.certificate.add.from.connection=<html>هذه هي الشهادة المقدمة من الخادم الذي تحاول الاتصال به. <br> هذه الشهادة غير موجودة في مخزن الشهادات الموثوقة لديك، مما يعني أنها غير موثوقة<br> ولا يمكنك الاتصال بهذا الخادم. <br><br>هل تريد الوثوق بها وإضافتها إلى مخزن الشهادات الموثوقة لديك؟</html>
dialog.certificate.unrecognized.server.certificate=<html>يُعرّف الخادم الذي تتصل به نفسه بشهادة <br>غير معترف بها من قِبل Spark. يُرجى مراجعة التفاصيل أدناه.</html>
dialog.certificate.ask.allow.self-signed=<html>يُعرّف الخادم الذي تتصل به نفسه بشهادة موقعة ذاتيًا. <br>يمنع التكوين الحالي لـ Spark استخدام الشهادات الموقعة ذاتيًا.<br>هل ترغب في تغيير هذا التكوين والمحاولة مرة أخرى؟</html>
