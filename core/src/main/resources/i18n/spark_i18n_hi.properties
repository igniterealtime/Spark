dialog.certificate.show=<html>यह वह प्रमाणपत्र और निजी कुंजी है जिसे आप ट्रस्टस्टोर में जोड़ना चाहते हैं। <br><br> इस प्रमाणपत्र को जोड़ने के बाद, स्पार्क इस प्रमाणपत्र द्वारा पहचाने गए सर्वरों के साथ सुरक्षित संचार स्थापित करने में सक्षम होगा। <br><br> यदि आप इस प्रमाणपत्र को जोड़ना चाहते हैं तो ओके बटन पर क्लिक करें।</html>
dialog.id.certificate.show=<html>यह वह प्रमाणपत्र है जिसे आप आइडेंटिटीस्टोर में जोड़ना चाहते हैं।<br><br> इस प्रमाणपत्र को जोड़ने के बाद, स्पार्क कनेक्शन स्थापित करते समय रिमोट सर्वर को यह प्रमाणपत्र प्रस्तुत कर सकेगा ताकि वह स्वयं को प्रमाणित कर सके और उस कनेक्शन को एन्क्रिप्ट कर सके।<br><br> यदि आप निश्चित हैं कि आप इस प्रमाणपत्र को जोड़ना चाहते हैं, तो ओके बटन पर क्लिक करें।</html>
dialog.certificate.add.from.connection=<html>यह उस सर्वर द्वारा प्रदान किया गया प्रमाणपत्र है जिससे आप कनेक्ट करने का प्रयास कर रहे हैं। <br> यह प्रमाणपत्र आपके ट्रस्टस्टोर में नहीं है, जिसका अर्थ है कि यह अविश्वसनीय है<br> और आप इस सर्वर से कनेक्ट नहीं कर सकते। <br><br> क्या आप इस पर भरोसा करना चाहते हैं और इस प्रमाणपत्र को अपने ट्रस्टस्टोर में जोड़ना चाहते हैं?</html>
dialog.certificate.unrecognized.server.certificate=<html>आप जिस सर्वर से कनेक्ट कर रहे हैं, वह एक ऐसे प्रमाणपत्र से अपनी पहचान बताता है जिसे स्पार्क मान्यता नहीं देता है। कृपया नीचे दिए गए विवरण की समीक्षा करें।</html>
dialog.certificate.ask.allow.self-signed=<html>आप जिस सर्वर से कनेक्ट कर रहे हैं, वह स्वयं-हस्ताक्षरित प्रमाणपत्र से अपनी पहचान बताता है। <br>स्पार्क की वर्तमान कॉन्फ़िगरेशन स्वयं-हस्ताक्षरित प्रमाणपत्रों के उपयोग की अनुमति नहीं देती है। <br>क्या आप इस कॉन्फ़िगरेशन को बदलकर पुनः प्रयास करना चाहेंगे?</html>
dialog.certificate.subject.label=विषय:

dialog.certificate.add.unrecognized.server.certificate=<html>क्या आप इस प्रमाणपत्र को स्पार्क द्वारा विश्वसनीय प्रमाणपत्रों के समूह में जोड़ना चाहते हैं?</html>
dialog.certificate.chain.add.from.connection=<html>यह उस सर्वर द्वारा प्रदान की गई प्रमाणपत्र श्रृंखला है जिससे आप कनेक्ट कर रहे हैं। <br> यह आपकी विश्वसनीय सूची में नहीं है, इसलिए आप कनेक्ट नहीं कर सकते। <br><br> क्या आप इन प्रमाणपत्रों को अपनी विश्वसनीय सूची में जोड़ना चाहते हैं?</html>
dialog.certificate.cannot.have.copy=यह प्रमाणपत्र पहले से ही ट्रस्टस्टोर में संग्रहीत है।
dialog.certificate.has.been.added=प्रमाणपत्र को ट्रस्टस्टोर में जोड़ दिया गया है।
dialog.certificate.has.been.added.to.identity.store=प्रमाणपत्र को आइडेंटिटीस्टोर में जोड़ दिया गया है।
dialog.certificate.is.distrusted=यह प्रमाणपत्र अमान्य है, इसलिए इस पर भरोसा नहीं किया जाना चाहिए, क्योंकि यह खतरनाक है। यदि आप फिर भी इस पर भरोसा करना चाहते हैं, तो 'भरोसा करें' विकल्प पर क्लिक करें या इसे अपवाद सूची में जोड़ें।
dialog.certificate.sure.to.delete=क्या आप वाकई इस प्रमाणपत्र को हटाना चाहते हैं? यदि आप ऐसा करते हैं, तो आप इस प्रमाणपत्र द्वारा पहचाने गए सर्वरों से सुरक्षित कनेक्शन स्थापित नहीं कर पाएंगे।
