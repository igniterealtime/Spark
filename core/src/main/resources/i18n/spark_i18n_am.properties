dialog.certificate.show=<html>ይህ ወደ TrustStore ለማከል እየሞከሩት ያለው የምስክር ወረቀት እና የግል ቁልፍ ነው። <br><br> ይህንን የምስክር ወረቀት ካከሉ በኋላ፣ ስፓርክ በዚህ የምስክር ወረቀት ተለይተው ከሚታወቁ አገልጋዮች ጋር ደህንነቱ የተጠበቀ <br> ግንኙነቶችን መመስረት ይችላል። <br><br> ይህንን የምስክር ወረቀት ማከል እንደሚፈልጉ እርግጠኛ ከሆኑ እሺ የሚለውን ቁልፍ ጠቅ ያድርጉ።</html>
dialog.id.certificate.show=<html>ይህ ወደ IdentityStore ለማከል እየሞከሩት ያለው ሰርተፊኬት ነው <br><br> ይህንን ሰርተፊኬት ካከሉ በኋላ፣ ስፓርክ ግንኙነትን ሲያቋቁሙ ይህንን ሰርተፊኬት ለርቀት አገልጋይ ማቅረብ ይችላል፣ ይህም እራሱን ለማረጋገጥ እና ያንን ግንኙነት ለማመስጠር ነው። <br><br> ይህንን ሰርተፊኬት ማከል እንደሚፈልጉ እርግጠኛ ከሆኑ እሺ የሚለውን ቁልፍ ይጫኑ።</html>
dialog.certificate.add.from.connection=<html>ይህ ለመገናኘት እየሞከሩት ባለው አገልጋይ የተሰጠው የምስክር ወረቀት ነው። <br> ይህ የምስክር ወረቀት በእርስዎ TrustStore ውስጥ የለም፣ ይህ ማለት የማይታመን ነው<br> እና ከዚህ አገልጋይ ጋር መገናኘት አይችሉም። <br><br> ይህንን የምስክር ወረቀት ወደ TrustStoreዎ ማከል ይፈልጋሉ?</html>
