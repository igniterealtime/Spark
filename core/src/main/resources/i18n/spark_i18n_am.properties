dialog.certificate.ask.allow.self-signed=<html>የሚገናኙት አገልጋይ እራሱን በራሱ የተፈረመ ሰርተፊኬት አለው። <br>የSpark የአሁኑ ውቅር በራስ የተፈረሙ ሰርተፊኬቶችን መጠቀምን አይፈቅድም።<br>ይህን ውቅር መቀየር እና እንደገና መሞከር ይፈልጋሉ?</html>
