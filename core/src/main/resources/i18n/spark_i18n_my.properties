dialog.certificate.show=<html>ဒါက TrustStore မှာ ထည့်ဖို့ကြိုးစားနေတဲ့ လက်မှတ်နဲ့ private key ပါ။ <br><br> ဒီလက်မှတ်ကို ထည့်ပြီးရင် Spark က ဒီလက်မှတ်နဲ့ ခွဲခြားသတ်မှတ်ထားတဲ့ ဆာဗာတွေနဲ့ လုံခြုံတဲ့ <br> ဆက်သွယ်မှုတွေကို တည်ဆောက်နိုင်ပါလိမ့်မယ်။ <br><br> ဒီလက်မှတ်ကို ထည့်ချင်တာ သေချာရင် OK ခလုတ်ကို နှိပ်ပါ။</html>
dialog.id.certificate.show=<html>ဒါက IdentityStore မှာ ထည့်ဖို့ကြိုးစားနေတဲ့ လက်မှတ်ပါ <br><br> ဒီလက်မှတ်ကို ထည့်ပြီးရင် Spark က ဒီလက်မှတ်ကို remote server ကို ပေးပို့ပြီး authenticate လုပ်ပြီး connection ကို encrypt လုပ်နိုင်ပါတယ်။ <br><br> ဒီလက်မှတ်ကို ထည့်ချင်တာ သေချာရင် OK ခလုတ်ကို နှိပ်ပါ။</html>
dialog.certificate.add.from.connection=<html>ဒါက သင်ချိတ်ဆက်ဖို့ကြိုးစားနေတဲ့ server ကပေးထားတဲ့ certificate ပါ။ <br> ဒီ certificate က သင့်ရဲ့ TrustStore မှာမရှိတာကြောင့် ယုံကြည်လို့မရပါဘူး<br> ပြီးတော့ ဒီ server ကို ချိတ်ဆက်လို့မရပါဘူး။ <br><br> ဒီ certificate ကို ယုံကြည်ပြီး သင့်ရဲ့ TrustStore မှာထည့်ချင်ပါသလား။</html>
dialog.certificate.unrecognized.server.certificate=<html>သင်ချိတ်ဆက်နေသောဆာဗာသည် Spark မှအသိအမှတ်မပြုသော <br>လက်မှတ်ဖြင့် ၎င်းကိုယ်တိုင်ကို ဖော်ထုတ်ပါသည်။ အောက်ပါအသေးစိတ်အချက်အလက်များကို ပြန်လည်သုံးသပ်ပါ။</html>
dialog.certificate.ask.allow.self-signed=<html>သင်ချိတ်ဆက်နေသော server သည် self-signed certificate ဖြင့် ၎င်းကိုယ်တိုင်ကို ဖော်ထုတ်သည်။ <br>Spark ၏ လက်ရှိ configuration သည် self-signed certificates များကို အသုံးပြုခွင့် မပြုပါ။<br>ဤ configuration ကို ပြောင်းလဲပြီး ထပ်မံကြိုးစားလိုပါသလား။</html>
