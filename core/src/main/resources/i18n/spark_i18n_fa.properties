dialog.certificate.show=<html>این گواهی و کلید خصوصی است که می‌خواهید به TrustStore اضافه کنید. <br><br> پس از افزودن این گواهی، Spark قادر خواهد بود ارتباطات امن <br> را با سرورهایی که توسط این گواهی شناسایی شده‌اند، برقرار کند. <br><br> اگر مطمئن هستید که می‌خواهید این گواهی را اضافه کنید، روی دکمه تأیید کلیک کنید.</html>
dialog.id.certificate.show=<html>این گواهی‌نامه‌ای است که می‌خواهید به IdentityStore اضافه کنید <br><br> پس از افزودن این گواهی‌نامه، Spark قادر خواهد بود این گواهی‌نامه را در حین برقراری اتصال به یک سرور راه دور ارائه دهد تا خود را احراز هویت کرده و آن اتصال را رمزگذاری کند. <br><br> اگر مطمئن هستید که می‌خواهید این گواهی‌نامه را اضافه کنید، روی دکمه OK کلیک کنید.</html>
dialog.certificate.add.from.connection=<html>این گواهی ارائه شده توسط سروری است که می‌خواهید به آن متصل شوید. <br> این گواهی در TrustStore شما نیست، به این معنی که قابل اعتماد نیست<br> و شما نمی‌توانید به این سرور متصل شوید. <br><br> آیا می‌خواهید به آن اعتماد کنید و این گواهی را به TrustStore خود اضافه کنید؟</html>
dialog.certificate.unrecognized.server.certificate=<html>سروری که به آن متصل می‌شوید، خود را با گواهی‌ای معرفی می‌کند که <br>توسط Spark شناخته نمی‌شود. لطفاً جزئیات زیر را بررسی کنید.</html>
dialog.certificate.ask.allow.self-signed=<html>سروری که به آن متصل می‌شوید، خود را با گواهی‌نامه‌ای که خودامضا شده است، شناسایی می‌کند. <br>پیکربندی فعلی اسپارک استفاده از گواهی‌نامه‌های خودامضا را مجاز نمی‌داند.<br>آیا می‌خواهید این پیکربندی را تغییر دهید و دوباره امتحان کنید؟</html>
dialog.certificate.subject.label=موضوع:

dialog.certificate.add.unrecognized.server.certificate=<html>آیا می‌خواهید این گواهی را به مجموعه گواهی‌هایی که توسط اسپارک مورد اعتماد هستند اضافه کنید؟</html>
dialog.certificate.chain.add.from.connection=<html>این زنجیره گواهی ارائه شده توسط سروری است که به آن متصل می‌شوید. <br> این در فهرست مورد اعتماد شما نیست، بنابراین نمی‌توانید متصل شوید. <br><br> آیا می‌خواهید این گواهی‌ها را به فهرست مورد اعتماد خود اضافه کنید؟</html>
