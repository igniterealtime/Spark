dialog.certificate.is.distrusted=گواهی نامعتبر است، بنابراین نباید به آن اعتماد کرد، زیرا خطرناک است. \n اگر هنوز می‌خواهید به آن اعتماد کنید، روی دکمه رادیویی اعتماد کلیک کنید یا آن را به لیست استثنا اضافه کنید.
dialog.certificate.sure.to.delete=آیا مطمئن هستید که می‌خواهید این گواهی را حذف کنید؟ \nاگر این کار را انجام دهید، نمی‌توانید اتصال امنی را به سرورهایی که توسط این گواهی شناسایی شده‌اند، برقرار کنید.
